<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Assignment 3</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 700px;
            padding: 40px;
            background: #1e293b;
            border-radius: 12px;
        }

        h1 {
            color: #38bdf8;
        }

        p {
            line-height: 1.6;
            color: #cbd5e1;
        }

        .services {
            margin-top: 25px;
            font-weight: bold;
            color: #f8fafc;
        }

        .updated {
            margin-top: 20px;
            color: #22c55e;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>AWS Static Website</h1>

        <p>
            This website was deployed as part of AWS Assignment 3.
        </p>

        <p class="services">
            Amazon S3 • CloudFront • Route 53 • HTTPS
        </p>

        <p>
            The website is stored in Amazon S3 and delivered globally
            through the Amazon CloudFront content delivery network.
        </p>

        <p class="updated">
            ✅ Updated after CloudFront caching test
        </p>
    </main>
</body>
</html>
